<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Primary Electric Blue Gradient -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Emerald Check Gradient -->
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="500" height="500" rx="100" fill="url(#bgGradient)" />

  <!-- Outer Radar Pulse / Geofence Ring -->
  <circle cx="250" cy="210" r="140" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="250" cy="210" r="115" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.6" />

  <!-- Stylized GPS Pin + Clock Hybrid -->
  <g filter="url(#glow)">
    <!-- Outer Location Pin Shield -->
    <path d="M250 85 C175 85 130 140 130 215 C130 295 235 365 250 375 C265 365 370 295 370 215 C370 140 325 85 250 85 Z" 
          fill="url(#blueGradient)" opacity="0.95" />

    <!-- Inner Clean Clock Dial -->
    <circle cx="250" cy="205" r="65" fill="#0F172A" stroke="#38BDF8" stroke-width="4" />

    <!-- Clock Hour Marks -->
    <circle cx="250" cy="155" r="4" fill="#94A3B8" />
    <circle cx="300" cy="205" r="4" fill="#94A3B8" />
    <circle cx="250" cy="255" r="4" fill="#94A3B8" />
    <circle cx="200" cy="205" r="4" fill="#94A3B8" />

    <!-- Dynamic Emerald Checkmark Pointer -->
    <path d="M225 205 L245 225 L285 180" 
          fill="none" 
          stroke="url(#greenGradient)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Brand Typography -->
  <text x="250" y="430" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="2" 
        text-anchor="middle" 
        fill="#FFFFFF">
    Geo<tspan fill="#38BDF8">Punch</tspan>
  </text>
  
  <text x="250" y="460" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" 
        font-weight="600" 
        letter-spacing="4" 
        text-anchor="middle" 
        fill="#94A3B8">
    WORKFORCE ATTENDANCE SAAS
  </text>
</svg>
